<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita &amp; Artikel — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">

  <div id="adminContentSource" style="display:none">
    <div class="panel">
      <div class="panel-head">
        <h2>Semua Artikel (<span id="totalArtikel">0</span>)</h2>
        <a class="btn btn-sm btn-navy" href="berita-form.html"><span class="material-symbols-outlined">add</span> Tulis Baru</a>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>Judul</th><th>Kategori</th><th>Tanggal</th><th>Status</th><th style="width:140px">Aksi</th></tr></thead>
          <tbody id="tabelArtikel"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/artikel-data.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/admin-common.js"></script>
  <script>
    AdminShell.build("Berita & Artikel");

    function render() {
      DB.getArtikel().then(function (arr) {
        document.getElementById("totalArtikel").textContent = arr.length;
        var tb = document.getElementById("tabelArtikel");
        if (!arr.length) {
          tb.innerHTML = '<tr><td colspan="5"><div class="empty-state"><span class="material-symbols-outlined">newspaper</span><p>Belum ada artikel. <a href="berita-form.html">Tulis yang pertama</a>.</p></div></td></tr>';
          return;
        }
        tb.innerHTML = arr.map(function (a) {
          return "<tr>" +
            '<td><div class="judul">' + AdminShell.escHtml(a.judul) + '</div><div class="meta">artikel.html?id=' + AdminShell.escHtml(a.id) + "</div></td>" +
            "<td><span class=\"badge badge-" + (a.kategori || "").toLowerCase() + "\">" + AdminShell.escHtml(a.kategori) + "</span></td>" +
            "<td>" + AdminShell.escHtml(a.tanggal) + "</td>" +
            "<td>" + (a.terbit ? '<span style="color:#2b8a3e;font-weight:600;font-size:13px">Terbit</span>' : '<span style="color:var(--outline);font-size:13px">Draft</span>') + "</td>" +
            '<td><div class="actions">' +
              '<a class="btn-icon" title="Lihat" href="../artikel.html?id=' + encodeURIComponent(a.id) + '" target="_blank"><span class="material-symbols-outlined">visibility</span></a>' +
              '<a class="btn-icon" title="Edit" href="berita-form.html?id=' + encodeURIComponent(a.id) + '"><span class="material-symbols-outlined">edit</span></a>' +
              '<button class="btn-icon danger" title="Hapus" data-hapus="' + AdminShell.escHtml(a.id) + '"><span class="material-symbols-outlined">delete</span></button>' +
            "</div></td></tr>";
        }).join("");
      });
    }

    document.getElementById("tabelArtikel").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-hapus]");
      if (!btn) return;
      var id = btn.getAttribute("data-hapus");
      DB.getArtikelById(id).then(function (art) {
        if (confirm('Hapus artikel "' + (art ? art.judul : id) + '"? Tindakan ini tidak bisa dibatalkan.')) {
          DB.hapusArtikel(id).then(function () {
            AdminShell.toast("Artikel dihapus.");
            render();
          });
        }
      });
    });

    render();
  </script>
</body>
</html>
