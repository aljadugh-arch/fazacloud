<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">

  <div id="adminContentSource" style="display:none">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>Aktivitas Terbaru</h2>
        <a class="btn btn-sm btn-navy" href="berita.html">Kelola Berita</a>
      </div>
      <div id="aktivitasTerbaru"></div>
    </div>

    <div class="panel">
      <h2>Aksi Cepat</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a class="btn btn-navy btn-sm" href="berita-form.html"><span class="material-symbols-outlined">add</span> Tulis Artikel Baru</a>
        <a class="btn btn-ghost btn-sm" href="konten.html"><span class="material-symbols-outlined">edit_note</span> Konten Halaman</a>
        <a class="btn btn-ghost btn-sm" href="ppdb.html"><span class="material-symbols-outlined">app_registration</span> Lihat Pendaftar</a>
        <a class="btn btn-ghost btn-sm" href="pesan.html"><span class="material-symbols-outlined">mail</span> Baca Pesan</a>
        <a class="btn btn-gold btn-sm" href="../index.html" target="_blank"><span class="material-symbols-outlined">open_in_new</span> Lihat Website</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/artikel-data.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/admin-common.js"></script>
  <script>
    AdminShell.build("Dashboard");

    Promise.all([DB.stats(), DB.getArtikel(), DB.getPendaftar(), DB.getPesan()]).then(function (r) {
      var s = r[0], artikel = r[1], pendaftar = r[2], pesan = r[3];
      document.getElementById("statGrid").innerHTML = [
        { icon: "newspaper", bg: "var(--primary-fixed)", color: "var(--primary)", num: s.artikelTerbit, lbl: "Artikel Terbit" },
        { icon: "app_registration", bg: "var(--secondary-fixed)", color: "var(--secondary)", num: s.pendaftarTotal, lbl: "Pendaftar PPDB" + (s.pendaftarBaru ? " (" + s.pendaftarBaru + " baru)" : "") },
        { icon: "mail", bg: "var(--tertiary-fixed)", color: "var(--tertiary)", num: s.pesanTotal, lbl: "Pesan Masuk" + (s.pesanBelumDibaca ? " (" + s.pesanBelumDibaca + " belum dibaca)" : "") },
        { icon: "photo_library", bg: "var(--surface-container)", color: "var(--heritage-navy)", num: s.galeriTotal, lbl: "Foto Galeri · " + s.guruTotal + " Guru" }
      ].map(function (c) {
        return '<div class="stat-card"><div class="icon" style="background:' + c.bg + ';color:' + c.color + '"><span class="material-symbols-outlined">' + c.icon + '</span></div>' +
               '<div><div class="num">' + c.num + '</div><div class="lbl">' + c.lbl + '</div></div></div>';
      }).join("");

      var items = [];
      artikel.slice(0, 3).forEach(function (a) {
        items.push({ icon: "newspaper", teks: 'Artikel "' + a.judul + '"', meta: a.kategori + " · " + a.tanggal, link: "berita.html" });
      });
      pendaftar.slice(0, 3).forEach(function (p) {
        items.push({ icon: "app_registration", teks: "Pendaftar baru: " + p.nama, meta: p.jalur + " · " + AdminShell.formatTanggal(p.waktu), link: "ppdb.html" });
      });
      pesan.slice(0, 3).forEach(function (m) {
        items.push({ icon: "mail", teks: "Pesan dari " + m.nama, meta: m.departemen + " · " + AdminShell.formatTanggal(m.waktu), link: "pesan.html" });
      });
      items = items.slice(0, 6);
      document.getElementById("aktivitasTerbaru").innerHTML = items.length
        ? '<div class="table-wrap"><table class="admin-table"><tbody>' + items.map(function (i) {
            return '<tr><td style="width:40px"><span class="material-symbols-outlined" style="color:var(--outline)">' + i.icon + '</span></td>' +
                   '<td><div class="judul">' + AdminShell.escHtml(i.teks) + '</div><div class="meta">' + AdminShell.escHtml(i.meta) + '</div></td>' +
                   '<td style="width:80px;text-align:right"><a class="btn btn-sm btn-ghost" href="' + i.link + '">Buka</a></td></tr>';
          }).join("") + "</tbody></table></div>"
        : '<div class="empty-state"><span class="material-symbols-outlined">inbox</span><p>Belum ada aktivitas.</p></div>';
    });
  </script>
</body>
</html>
