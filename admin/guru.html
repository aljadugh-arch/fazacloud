<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenaga Pendidik — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    .guru-item { display: flex; gap: 16px; align-items: flex-start; padding: 16px; border: var(--border-card); border-radius: var(--radius-lg); background: var(--surface-white); margin-bottom: 12px; }
    .guru-item img { width: 72px; height: 72px; border-radius: 99px; object-fit: cover; background: var(--surface-variant); flex: none; }
    .guru-item .info { flex: 1; min-width: 0; }
    .guru-item .nama { font-weight: 600; font-size: 15px; }
    .guru-item .jabatan { font-size: 12px; color: var(--primary); font-weight: 600; margin-top: 2px; }
    .guru-item .bio { font-size: 13px; color: var(--on-surface-variant); margin-top: 6px; }
  </style>
</head>
<body class="admin">

  <div id="adminContentSource" style="display:none">
    <div class="panel">
      <div class="panel-head">
        <h2>Tenaga Pendidik (<span id="totalGuru">0</span>)</h2>
        <button class="btn btn-sm btn-navy" id="btnTambah"><span class="material-symbols-outlined">add</span> Tambah Guru</button>
      </div>
      <div id="daftarGuru"></div>
    </div>

    <div class="panel form-panel" id="panelForm" style="display:none">
      <h2 id="formTitle">Tambah Guru</h2>
      <form id="formGuru" class="form-grid">
        <input type="hidden" id="guruId">
        <div class="form-row two">
          <div class="field">
            <label for="guruNama">Nama Lengkap <span class="req">*</span></label>
            <input id="guruNama" type="text" required placeholder="Contoh: Dr. Budi Santoso, M.Pd.">
          </div>
          <div class="field">
            <label for="guruJabatan">Jabatan / Mapel <span class="req">*</span></label>
            <input id="guruJabatan" type="text" required placeholder="Contoh: Kepala Sekolah">
          </div>
        </div>
        <div class="field">
          <label>Foto <span class="req">*</span></label>
          <div id="uploaderGuru"></div>
          <input type="hidden" id="guruFoto">
          <small class="muted" style="display:block;margin-top:6px">Rekomendasi: <strong>600 × 600 px</strong> (kotak), foto wajah jelas, maks 3 MB.</small>
        </div>
        <div class="field">
          <label for="guruBio">Bio Singkat</label>
          <textarea id="guruBio" rows="3" placeholder="Deskripsi singkat tentang guru ini..."></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-navy" type="submit"><span class="material-symbols-outlined">save</span> Simpan</button>
          <button class="btn btn-ghost" type="button" id="btnBatal">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/artikel-data.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/admin-common.js"></script>
  <script>
    AdminShell.build("Tenaga Pendidik");
    AdminShell.imageUploader("uploaderGuru", "guruFoto", 120);

    function render() {
      DB.guru.get().then(function (arr) {
        document.getElementById("totalGuru").textContent = arr.length;
        var wrap = document.getElementById("daftarGuru");
        if (!arr.length) {
          wrap.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">groups</span><p>Belum ada data guru.</p></div>';
          return;
        }
        wrap.innerHTML = arr.map(function (g) {
          var src = g.foto.startsWith("assets/") ? "../" + g.foto : g.foto;
          return '<div class="guru-item">' +
            '<img src="' + AdminShell.escHtml(src) + '" alt="' + AdminShell.escHtml(g.nama) + '">' +
            '<div class="info"><div class="nama">' + AdminShell.escHtml(g.nama) + '</div>' +
            '<div class="jabatan">' + AdminShell.escHtml(g.jabatan) + "</div>" +
            '<div class="bio">' + AdminShell.escHtml(g.bio) + "</div></div>" +
            '<div class="actions">' +
              '<button class="btn-icon" title="Edit" data-edit="' + g.id + '"><span class="material-symbols-outlined">edit</span></button>' +
              '<button class="btn-icon danger" title="Hapus" data-hapus="' + g.id + '"><span class="material-symbols-outlined">delete</span></button>' +
            "</div></div>";
        }).join("");
      });
    }

    function bukaForm(data) {
      document.getElementById("panelForm").style.display = "";
      document.getElementById("formTitle").textContent = data ? "Edit Guru" : "Tambah Guru";
      document.getElementById("guruId").value = data ? data.id : "";
      document.getElementById("guruNama").value = data ? data.nama : "";
      document.getElementById("guruJabatan").value = data ? data.jabatan : "";
      document.getElementById("uploaderGuru").setValue(data ? data.foto : "");
      document.getElementById("guruBio").value = data ? data.bio : "";
      document.getElementById("guruNama").focus();
    }
    function tutupForm() { document.getElementById("panelForm").style.display = "none"; }

    document.getElementById("btnTambah").addEventListener("click", function () { bukaForm(null); });
    document.getElementById("btnBatal").addEventListener("click", tutupForm);

    document.getElementById("daftarGuru").addEventListener("click", function (e) {
      var edit = e.target.closest("[data-edit]");
      if (edit) {
        DB.guru.get().then(function (arr) {
          bukaForm(arr.find(function (x) { return x.id === edit.getAttribute("data-edit"); }));
        });
        return;
      }
      var hapus = e.target.closest("[data-hapus]");
      if (hapus && confirm("Hapus data guru ini?")) {
        DB.guru.hapus(hapus.getAttribute("data-hapus")).then(function () {
          AdminShell.toast("Data guru dihapus.");
          render();
        });
      }
    });

    document.getElementById("formGuru").addEventListener("submit", function (e) {
      e.preventDefault();
      var id = document.getElementById("guruId").value;
      DB.guru.simpan({
        id: id || "gr" + Date.now(),
        nama: document.getElementById("guruNama").value.trim(),
        jabatan: document.getElementById("guruJabatan").value.trim(),
        foto: document.getElementById("uploaderGuru").getValue(),
        bio: document.getElementById("guruBio").value.trim()
      }).then(function () {
        AdminShell.toast("Data guru disimpan.");
        tutupForm();
        render();
      });
    });

    render();
  </script>
</body>
</html>
