<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <a class="brand" href="../index.html">
        <span class="logo-badge">SN</span>
        <span class="brand-text"><span class="b1">PANEL ADMIN</span><span class="b2">Website Sekolah</span></span>
      </a>
      <h1>Masuk ke Dashboard</h1>
      <p class="sub">Kelola konten website sekolah dari satu tempat.</p>
      <div class="alert" id="alertLogin">Email atau kata sandi salah.</div>
      <form id="formLogin" class="form-grid">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="admin@smanusantara.sch.id" required autocomplete="username">
        </div>
        <div class="field">
          <label for="sandi">Kata Sandi</label>
          <input id="sandi" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn btn-navy btn-block" type="submit" id="btnLogin">Masuk <span class="material-symbols-outlined">login</span></button>
      </form>
      <div class="hint">Demo: <strong>admin@smanusantara.sch.id</strong> / <strong>admin123</strong></div>
    </div>
  </div>

  <script>
    (function () {
      var TBASE = (location.pathname.match(/^\/t\/[a-z0-9-]+/) || [""])[0];
      if (sessionStorage.getItem("cms_token")) { location.replace(TBASE + "/admin/index.html"); return; }
      document.getElementById("formLogin").addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = document.getElementById("btnLogin");
        btn.disabled = true;
        btn.textContent = "Memeriksa…";
        fetch(((location.pathname.match(/^\/t\/([a-z0-9-]+)/)||[])[0]||"") + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("sandi").value
          })
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (j.ok && j.token) {
            sessionStorage.setItem("cms_token", j.token);
            location.replace(TBASE + "/admin/index.html");
          } else {
            document.getElementById("alertLogin").textContent = j.error || "Login gagal.";
            document.getElementById("alertLogin").classList.add("show");
            btn.disabled = false;
            btn.innerHTML = 'Masuk <span class="material-symbols-outlined">login</span>';
          }
        }).catch(function () {
          document.getElementById("alertLogin").textContent = "Server tidak merespons. Jalankan: node server/server.js";
          document.getElementById("alertLogin").classList.add("show");
          btn.disabled = false;
          btn.innerHTML = 'Masuk <span class="material-symbols-outlined">login</span>';
        });
      });
    })();
  </script>
</body>
</html>
