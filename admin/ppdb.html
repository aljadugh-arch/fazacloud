<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftar PPDB — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">

  <div id="adminContentSource" style="display:none">
    <div class="panel">
      <div class="panel-head">
        <h2>Pendaftar PPDB (<span id="totalPendaftar">0</span>)</h2>
        <button class="btn btn-sm btn-ghost" id="btnExport"><span class="material-symbols-outlined">download</span> Export CSV</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>Nama / NISN</th><th>Asal Sekolah</th><th>Jalur</th><th>Kontak Ortu</th><th>Waktu</th><th>Status</th><th style="width:150px">Aksi</th></tr></thead>
          <tbody id="tabelPendaftar"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/artikel-data.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/admin-common.js"></script>
  <script>
    AdminShell.build("Pendaftar PPDB");

    var STATUS = ["baru", "diverifikasi", "diterima", "ditolak"];

    function render() {
      DB.getPendaftar().then(function (arr) {
        document.getElementById("totalPendaftar").textContent = arr.length;
        var tb = document.getElementById("tabelPendaftar");
        if (!arr.length) {
          tb.innerHTML = '<tr><td colspan="7"><div class="empty-state"><span class="material-symbols-outlined">app_registration</span><p>Belum ada pendaftar. Formulir PPDB di halaman publik akan mengisi tabel ini.</p></div></td></tr>';
          return;
        }
        tb.innerHTML = arr.map(function (p) {
          var opts = STATUS.map(function (s) {
            return '<option value="' + s + '"' + (p.status === s ? " selected" : "") + ">" + s.charAt(0).toUpperCase() + s.slice(1) + "</option>";
          }).join("");
          return "<tr>" +
            '<td><div class="judul">' + AdminShell.escHtml(p.nama) + '</div><div class="meta">NISN ' + AdminShell.escHtml(p.nisn) + "</div></td>" +
            "<td>" + AdminShell.escHtml(p.asalSekolah) + "</td>" +
            "<td>" + AdminShell.escHtml(p.jalur) + "</td>" +
            '<td><div style="font-size:13px">' + AdminShell.escHtml(p.email) + "<br>" + AdminShell.escHtml(p.whatsapp) + "</div></td>" +
            '<td style="font-size:13px;white-space:nowrap">' + AdminShell.formatTanggal(p.waktu) + "</td>" +
            '<td><span class="badge-status ' + p.status + '">' + p.status + "</span></td>" +
            '<td><div class="actions">' +
              '<select data-status-id="' + p.id + '" style="padding:6px 8px;border:1px solid var(--outline-variant);border-radius:6px;font-size:13px">' + opts + "</select>" +
              '<button class="btn-icon danger" title="Hapus" data-hapus="' + p.id + '"><span class="material-symbols-outlined">delete</span></button>' +
            "</div></td></tr>";
        }).join("");
      });
    }

    document.getElementById("tabelPendaftar").addEventListener("change", function (e) {
      var sel = e.target.closest("[data-status-id]");
      if (sel) {
        DB.updateStatusPendaftar(sel.getAttribute("data-status-id"), sel.value).then(function () {
          AdminShell.toast("Status diperbarui.");
          render();
        });
      }
    });
    document.getElementById("tabelPendaftar").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-hapus]");
      if (btn && confirm("Hapus data pendaftar ini?")) {
        DB.hapusPendaftar(btn.getAttribute("data-hapus")).then(function () {
          AdminShell.toast("Data dihapus.");
          render();
        });
      }
    });

    document.getElementById("btnExport").addEventListener("click", function () {
      DB.getPendaftar().then(function (arr) {
        if (!arr.length) { AdminShell.toast("Tidak ada data untuk diexport."); return; }
        var rows = [["ID","Nama","NISN","Asal Sekolah","Jalur","Email Ortu","WhatsApp","Status","Waktu"]];
        arr.forEach(function (p) { rows.push([p.id, p.nama, p.nisn, p.asalSekolah, p.jalur, p.email, p.whatsapp, p.status, p.waktu]); });
        var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
        var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "pendaftar-ppdb.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });

    render();
  </script>
</body>
</html>
