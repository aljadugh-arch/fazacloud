<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Masuk — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">

  <div id="adminContentSource" style="display:none">
    <div class="panel">
      <div class="panel-head">
        <h2>Pesan Masuk (<span id="totalPesan">0</span>)</h2>
      </div>
      <div id="daftarPesan"></div>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/artikel-data.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/admin-common.js"></script>
  <script>
    AdminShell.build("Pesan Masuk");

    var DEPT = { umum: "Informasi Umum", ppdb: "Pendaftaran (PPDB)", akademik: "Akademik & Kurikulum", kesiswaan: "Humas & Kesiswaan" };

    function render() {
      DB.getPesan().then(function (arr) {
        document.getElementById("totalPesan").textContent = arr.length;
        var wrap = document.getElementById("daftarPesan");
        if (!arr.length) {
          wrap.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">mail</span><p>Belum ada pesan masuk. Formulir kontak di halaman publik akan mengisi daftar ini.</p></div>';
          return;
        }
        wrap.innerHTML = arr.map(function (m) {
          return '<div class="panel" style="margin-bottom:12px;padding:16px 20px;' + (m.dibaca ? "" : "border-left:4px solid var(--academic-gold);") + '">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">' +
              '<div>' +
                '<div style="font-weight:600;font-size:15px">' + AdminShell.escHtml(m.nama) + (m.dibaca ? "" : ' <span class="badge-status baru">Baru</span>') + '</div>' +
                '<div class="meta" style="font-size:12px;color:var(--outline);margin-top:2px">' + AdminShell.escHtml(m.email) + " · " + (DEPT[m.departemen] || m.departemen) + " · " + AdminShell.formatTanggal(m.waktu) + "</div>" +
              "</div>" +
              '<div class="actions">' +
                (m.dibaca ? "" : '<button class="btn-icon" title="Tandai dibaca" data-baca="' + m.id + '"><span class="material-symbols-outlined">mark_email_read</span></button>') +
                '<a class="btn-icon" title="Balas via email" href="mailto:' + AdminShell.escHtml(m.email) + '"><span class="material-symbols-outlined">reply</span></a>' +
                '<button class="btn-icon danger" title="Hapus" data-hapus="' + m.id + '"><span class="material-symbols-outlined">delete</span></button>' +
              "</div>" +
            "</div>" +
            '<p style="margin-top:12px;color:var(--on-surface-variant);font-size:14px;line-height:1.6;white-space:pre-wrap">' + AdminShell.escHtml(m.isi) + "</p>" +
          "</div>";
        }).join("");
      });
    }

    document.getElementById("daftarPesan").addEventListener("click", function (e) {
      var baca = e.target.closest("[data-baca]");
      if (baca) {
        DB.tandaiDibaca(baca.getAttribute("data-baca")).then(function () {
          AdminShell.toast("Ditandai sudah dibaca.");
          render();
        });
        return;
      }
      var hapus = e.target.closest("[data-hapus]");
      if (hapus && confirm("Hapus pesan ini?")) {
        DB.hapusPesan(hapus.getAttribute("data-hapus")).then(function () {
          AdminShell.toast("Pesan dihapus.");
          render();
        });
      }
    });

    render();
  </script>
</body>
</html>
