<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Wali Murid — Jurnal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
:root{--navy:#05386b;--green:#1da462;--white:#fff;--surface:#f4f6fa;--border:#dde3ed;--text:#1a2a3a;--muted:#6b7a90;--error:#dc3545;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--surface);min-height:100vh}
.header{background:var(--navy);padding:20px;color:var(--white)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.brand svg{width:28px;height:28px}
.user-info{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:600}
.btn-logout{background:none;border:1px solid rgba(255,255,255,0.3);color:var(--white);padding:6px 16px;border-radius:var(--radius);font-size:13px}
.main{padding:20px;max-width:600px;margin:0 auto}
.card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card-title{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px}
.stat-row{display:flex;gap:12px}
.stat{flex:1;background:var(--surface);padding:16px;border-radius:var(--radius);text-align:center}
.stat-num{font-size:20px;font-weight:700;color:var(--navy)}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
th{font-weight:600;color:var(--muted);background:var(--surface)}
.badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:500}
.badge.hadir{background:#dcfce7;color:#166534}
.badge.alfa{background:#fee2e2;color:#991b1b}
.badge.lunas{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<header class="header">
<div class="header-top">
<div class="brand">
<svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z" fill="#1da462"/><path d="M12 22L2 17v-5l10-5 10 5v5l-10 5z" fill="#158a50"/><path d="M12 7l-6 3v4l6 3 6-3v-4l-6-3z" fill="#fff"/></svg>
FazaCloud
</div>
<button class="btn-logout" onclick="logout()">Keluar</button>
</div>
</header>
<main class="main">
<div class="card">
<div class="card-title">Pilih Anak</div>
<div class="form-group">
<label>Anak</label>
<select id="siswaSelect" onchange="loadData()"><option value="">— Pilih Anak —</option></select>
</div>
</div>
<div id="dataSection" style="display:none">
<div class="card">
<div class="card-title">Statistik Anak</div>
<div class="stat-row">
<div class="stat"><div class="stat-num" id="hadirCount">0</div><div class="stat-label">Hadir Bulan Ini</div></div>
<div class="stat"><div class="stat-num" id="saldo">Rp0</div><div class="stat-label">Saldo Kanteen</div></div>
</div>
</div>
<div class="card">
<div class="card-title">Absensi</div>
<table><thead><tr><th>Tanggal</th><th>Status</th><th>Datang</th></tr></thead><tbody id="absensiList"></tbody></table>
</div>
<div class="card">
<div class="card-title">Tagihan Belum Lunas</div>
<table><thead><tr><th>Nama</th><th>Nominal</th><th>Jatuh Tempo</th></tr></thead><tbody id="tagihanList"></tbody></table>
</div>
</div>
</main>
<script>
var BASE=location.pathname.match(/^\/t\/([a-z0-9-]+)/)?'/t/'+location.pathname.match(/^\/t\/([a-z0-9-]+)/)[1]:'';
var TOKEN=sessionStorage.getItem('jurnal_token');
var ROLE=sessionStorage.getItem('jurnal_role');
var USER_ID=sessionStorage.getItem('jurnal_id');
var USER_NAME=sessionStorage.getItem('jurnal_nama')||'Wali';
if(!TOKEN||ROLE!=='wali'){location.href=BASE+'/jurnal/login.html';throw'';}
document.querySelector('.avatar').textContent=USER_NAME.charAt(0).toUpperCase();
function auth(){return{Authorization:'Bearer '+TOKEN};}
function api(u){return BASE+u;}
function logout(){sessionStorage.clear();location.href=BASE+'/jurnal/login.html';}
function loadSiswa(){fetch(api('/api/jurnal/users/wali/'+USER_ID),{headers:auth()}).then(r=>r.json()).then(d=>{if(d.ok&&d.data){var s=document.getElementById('siswaSelect');d.data.siswa_ids.forEach(function(id){s.innerHTML+='<option value="'+id+'">'+id+'</option>';});}}).catch(()=>{});}
function loadData(){var sid=document.getElementById('siswaSelect').value;if(!sid)return;document.getElementById('dataSection').style.display='block';fetch(api('/api/jurnal/absensi/siswa?siswa_id='+sid),{headers:auth()}).then(r=>r.json()).then(d=>{if(d.ok){var h=0;d.data.slice(0,15).forEach(x=>{if(x.jenis==='hadir')h++;});document.getElementById('hadirCount').textContent=h;var html='';d.data.slice(0,10).forEach(x=>{html+='<tr><td>'+x.tanggal+'</td><td><span class="badge '+(x.jenis==='hadir'?'hadir':'alfa')+'">'+x.jenis+'</span></td><td>'+(x.jam_datang?new Date(x.jam_datang).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-')+'</td></tr>';});document.getElementById('absensiList').innerHTML=html;}}).catch(()=>{});
fetch(api('/api/jurnal/kanteen/saldo/'+sid),{headers:auth()}).then(r=>r.json()).then(d=>{if(d.ok)document.getElementById('saldo').textContent='Rp'+(d.data.saldo||0).toLocaleString('id-ID');}).catch(()=>{});
fetch(api('/api/jurnal/tagihan?siswa_id='+sid+'&status=belum'),{headers:auth()}).then(r=>r.json()).then(d=>{if(d.ok){var html='';d.data.forEach(x=>{html+='<tr><td>'+x.nama+'</td><td>Rp'+x.nominal.toLocaleString('id-ID')+'</td><td>'+x.jatuh_tempo+'</td></tr>';});document.getElementById('tagihanList').innerHTML=html;}}).catch(()=>{});}
loadSiswa();
</script>
</body>
</html>
