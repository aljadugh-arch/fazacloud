<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceklok Guru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
:root{--navy:#05386b;--green:#1da462;--white:#fff;--surface:#f4f6fa;--border:#dde3ed;--text:#1a2a3a;--muted:#6b7a90;--error:#dc3545;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--surface);min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--navy);padding:20px;color:var(--white)}
.sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}
.sidebar-brand svg{width:32px;height:32px}
.sidebar-brand span{font-weight:800;font-size:18px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);color:rgba(255,255,255,0.8);text-decoration:none;margin-bottom:4px;font-size:14px;font-weight:500}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.15);color:var(--white)}
.topbar{position:fixed;top:0;left:240px;right:0;height:64px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:10}
.topbar-title{font-size:16px;font-weight:600;color:var(--text)}
.topbar-user{display:flex;align-items:center;gap:10px}
.topbar-user .avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.btn-logout{background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Material+Symbols+Outlined';font-size:20px}
.main{padding:88px 24px 24px 264px}
.card{background:var(--white);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:16px}
.btn-ceklok{width:200px;height:200px;border-radius:50%;background:var(--green);color:var(--white);border:8px solid #158a50;font-size:24px;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;margin:0 auto 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.btn-ceklok:hover{transform:scale(1.05);box-shadow:0 8px 24px rgba(29,164,98,0.4)}
.btn-ceklok:active{transform:scale(0.95)}
.btn-ceklok .material-symbols-outlined{font-size:48px}
.btn-ceklok.pulang{background:var(--navy);border-color:#042a52}
.status-text{text-align:center;font-size:18px;font-weight:600;margin-bottom:24px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-weight:600;color:var(--muted);background:var(--surface)}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge.hadir{background:#f0fdf4;color:var(--green)}
.badge.izin{background:#fef3c7;color:#d97706}
@media(max-width:768px){.sidebar{display:none}.main{padding:80px 16px 16px 16px}.topbar{left:0}}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:8px;justify-content:space-around;z-index:20}
@media(max-width:768px){.mobile-nav{display:flex}}
.mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-decoration:none}
.mobile-nav a.active{color:var(--navy)}
.mobile-nav .material-symbols-outlined{font-size:24px}
</style>
</head>
<body>
<aside class="sidebar">
<div class="sidebar-brand">
<svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z" fill="#1da462"/><path d="M12 22L2 17v-5l10-5 10 5v5l-10 5z" fill="#158a50"/><path d="M12 7l-6 3v4l6 3 6-3v-4l-6-3z" fill="#fff"/></svg>
<span>FazaCloud</span>
</div>
<nav>
<a href="index.html" class="nav-item"><span class="material-symbols-outlined">dashboard</span> Beranda</a>
<a href="absensi.html" class="nav-item"><span class="material-symbols-outlined">qr_code_scanner</span> Absensi QR</a>
<a href="jurnal.html" class="nav-item"><span class="material-symbols-outlined">menu_book</span> Jurnal Mengajar</a>
<a href="ceklok.html" class="nav-item active"><span class="material-symbols-outlined">how_to_reg</span> Ceklok</a>
</nav>
<div style="margin-top:auto">
<a href="../../jurnal/login.html" class="nav-item"><span class="material-symbols-outlined">logout</span> Keluar</a>
</div>
</aside>
<header class="topbar">
<div class="topbar-title">Ceklok Kehadiran</div>
<div class="topbar-user">
<div class="avatar" id="userAvatar">G</div>
<span id="userName">Guru</span>
<button class="btn-logout" onclick="logout()">logout</button>
</div>
</header>
<main class="main">
<div class="card">
<div class="card-title" style="text-align:center">Absen Sekarang</div>
<div id="statusText" class="status-text">Anda belum absen hari ini</div>
<button id="btnCeklok" class="btn-ceklok" onclick="ceklok()">
<span class="material-symbols-outlined">how_to_reg</span>
<span>MASUK</span>
</button>
</div>
<div class="card">
<div class="card-title">Riwayat Bulan Ini</div>
<table>
<thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Status</th></tr></thead>
<tbody id="riwayat"></tbody>
</table>
</div>
</main>
<nav class="mobile-nav">
<a href="index.html"><span class="material-symbols-outlined">dashboard</span>Beranda</a>
<a href="absensi.html"><span class="material-symbols-outlined">qr_code_scanner</span>Absensi</a>
<a href="jurnal.html"><span class="material-symbols-outlined">menu_book</span>Jurnal</a>
<a href="ceklok.html" class="active"><span class="material-symbols-outlined">how_to_reg</span>Ceklok</a>
</nav>
<script>
var BASE=location.pathname.match(/^\/t\/([a-z0-9-]+)/)?'/t/'+location.pathname.match(/^\/t\/([a-z0-9-]+)/)[1]:'';
var TOKEN=sessionStorage.getItem('jurnal_token');
var ROLE=sessionStorage.getItem('jurnal_role');
var USER_ID=sessionStorage.getItem('jurnal_id');
var USER_NAME=sessionStorage.getItem('jurnal_nama')||'Guru';
if(!TOKEN||ROLE!=='guru'){location.href=BASE+'/jurnal/login.html';throw'';}
document.getElementById('userName').textContent=USER_NAME;
document.getElementById('userAvatar').textContent=USER_NAME.charAt(0).toUpperCase();
function auth(){return{Authorization:'Bearer '+TOKEN};}
function logout(){sessionStorage.clear();location.href=BASE+'/jurnal/login.html';}
function api(u){return BASE+u;}
function fmt(t){return t?new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-';}
function loadCeklok(){var today=new Date().toISOString().split('T')[0];fetch(api('/api/jurnal/ceklok?guru_id='+USER_ID+'&tanggal='+today),{headers:auth()}).then(r=>r.json()).then(d=>{if(d.ok&&d.data.length){var x=d.data[0];document.getElementById('statusText').textContent='Anda sudah absen';var btn=document.getElementById('btnCeklok');if(x.jam_pulang){btn.className='btn-ceklok';btn.querySelector('span:last-child').textContent='SUDAH PULANG';btn.disabled=true;}else{btn.className='btn-ceklok pulang';btn.querySelector('span:last-child').textContent='PULANG';btn.onclick=function(){ceklok('pulang');};}}}).catch(()=>{});}
function loadRiwayat(){var bulan=new Date().toISOString().slice(0,7);fetch(api('/api/jurnal/ceklok?guru_id='+USER_ID),{headers:auth()}).then(r=>r.json()).then(d=>{if(d.ok){var html='';d.data.slice(0,30).forEach(x=>{html+='<tr><td>'+(x.tanggal||'')+'</td><td>'+fmt(x.jam_masuk)+'</td><td>'+fmt(x.jam_pulang)+'</td><td><span class="badge '+(x.status==='hadir'?'hadir':'izin')+'">'+(x.status||'hadir')+'</span></td></tr>';});document.getElementById('riwayat').innerHTML=html||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Belum ada riwayat</td></tr>';}}).catch(()=>{});}
function ceklok(jenis){fetch(api('/api/jurnal/ceklok'),{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({jenis:jenis||'masuk'})}).then(r=>r.json()).then(d=>{if(d.ok){alert('Berhasil '+jenis);loadCeklok();loadRiwayat();}else{alert(d.error||'Gagal');}}).catch(()=>alert('Error'));}
loadCeklok();loadRiwayat();
</script>
</body>
</html>
