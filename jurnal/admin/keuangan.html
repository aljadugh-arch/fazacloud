<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keuangan Jurnal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#f4f6fa;margin:0;color:#1a2a3a}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #0001}.btn{background:#05386b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.green{background:#1da462}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}input,select{padding:10px;border:1px solid #dde3ed;border-radius:10px;width:100%}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dde3ed;text-align:left;font-size:13px}th{background:#f4f6fa;color:#6b7a90}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><h2>Tagihan & Tabungan</h2><button class="btn" onclick="location.href='index.html'">Dashboard</button></div><div class="card"><h3>Tambah Tagihan</h3><div class="grid"><input id="siswa" placeholder="ID Siswa"><input id="nama" placeholder="Nama Tagihan"><input id="nominal" type="number" placeholder="Nominal"><input id="tempo" type="date"><button class="btn green" onclick="addTagihan()">Simpan</button></div></div><div class="card"><h3>Setor/Tarik Tabungan</h3><div class="grid"><input id="tsiswa" placeholder="ID Siswa"><select id="jenis"><option value="setor">Setor</option><option value="tarik">Tarik</option></select><input id="tnominal" type="number" placeholder="Nominal"><input id="ket" placeholder="Keterangan"><button class="btn green" onclick="addTabungan()">Simpan</button></div></div><div class="card"><h3>Daftar Tagihan</h3><table><thead><tr><th>Siswa</th><th>Nama</th><th>Nominal</th><th>Status</th><th>Tempo</th></tr></thead><tbody id="tagihan"></tbody></table></div><div class="card"><h3>Histori Tabungan</h3><table><thead><tr><th>Siswa</th><th>Tanggal</th><th>Jenis</th><th>Nominal</th><th>Saldo</th></tr></thead><tbody id="tabungan"></tbody></table></div></div><script>var BASE=location.pathname.match(/^\/t\/([a-z0-9-]+)/)?'/t/'+location.pathname.match(/^\/t\/([a-z0-9-]+)/)[1]:'';var T=sessionStorage.getItem('jurnal_token');if(!T){location.href=BASE+'/jurnal/login.html'}function auth(){return{Authorization:'Bearer '+T}}function api(u){return BASE+u}function load(){fetch(api('/api/jurnal/tagihan'),{headers:auth()}).then(r=>r.json()).then(d=>{tagihan.innerHTML=(d.data||[]).map(x=>'<tr><td>'+x.siswa_id+'</td><td>'+x.nama+'</td><td>Rp'+Number(x.nominal||0).toLocaleString('id-ID')+'</td><td>'+x.status+'</td><td>'+x.jatuh_tempo+'</td></tr>').join('')});fetch(api('/api/jurnal/tabungan'),{headers:auth()}).then(r=>r.json()).then(d=>{tabungan.innerHTML=(d.data||[]).map(x=>'<tr><td>'+x.siswa_id+'</td><td>'+x.tanggal+'</td><td>'+x.jenis+'</td><td>Rp'+Number(x.nominal||0).toLocaleString('id-ID')+'</td><td>Rp'+Number(x.saldo_akhir||0).toLocaleString('id-ID')+'</td></tr>').join('')})}function addTagihan(){fetch(api('/api/jurnal/tagihan'),{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({siswa_id:siswa.value,nama:nama.value,nominal:Number(nominal.value),jatuh_tempo:tempo.value,status:'belum'})}).then(()=>load())}function addTabungan(){fetch(api('/api/jurnal/tabungan'),{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({siswa_id:tsiswa.value,tanggal:new Date().toISOString().slice(0,10),jenis:jenis.value,nominal:Number(tnominal.value),keterangan:ket.value})}).then(()=>load())}load()</script></body></html>
