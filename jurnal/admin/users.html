<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengguna Jurnal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Inter,sans-serif;background:#f4f6fa;margin:0;color:#1a2a3a}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.btn{background:#05386b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.green{background:#1da462}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #dde3ed;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:#05386b;color:#fff}input,select{padding:10px;border:1px solid #dde3ed;border-radius:10px;width:100%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dde3ed;text-align:left;font-size:13px}th{background:#f4f6fa;color:#6b7a90}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style><link rel="stylesheet" href="../assets/jurnal-shell.css">
<link rel="stylesheet" href="../assets/jurnal-excel.css">
<link rel="stylesheet" href="../assets/jurnal-feature.css">
</head><body><div class="wrap"><div class="top"><h2>Manajemen Pengguna Jurnal</h2><button class="btn" onclick="location.href='index.html'">Dashboard</button></div><div class="card"><div class="tabs"><button class="tab active" onclick="setRole('guru',this)">Guru</button><button class="tab" onclick="setRole('siswa',this)">Siswa</button><button class="tab" onclick="setRole('wali',this)">Wali</button><button class="tab" onclick="setRole('kasir',this)">Kasir</button></div><div class="grid"><input id="nama" placeholder="Nama"><input id="email" placeholder="Email"><input id="password" placeholder="Password"><input id="extra" placeholder="NIP/NIS/Kelas/Siswa IDs"><button class="btn green" onclick="saveUser()">Tambah</button></div></div><div class="card"><h3>Data <span id="roleName">Guru</span></h3><table><thead><tr><th>Nama</th><th>Email</th><th>Info</th><th>Aksi</th></tr></thead><tbody id="list"></tbody></table></div><div class="card"><h3>QR Siswa</h3><div id="qr"></div></div></div><script>var BASE=location.pathname.match(/^\/t\/([a-z0-9-]+)/)?'/t/'+location.pathname.match(/^\/t\/([a-z0-9-]+)/)[1]:'';var T=sessionStorage.getItem('jurnal_token')||sessionStorage.getItem('token');var role='guru';function auth(){return{Authorization:'Bearer '+T}}function api(u){return BASE+u}function setRole(r,btn){role=r;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('roleName').textContent=r;load()}function load(){fetch(api('/api/jurnal/users/'+role),{headers:auth()}).then(r=>r.json()).then(d=>{var h='';(d.data||[]).forEach(u=>{h+='<tr><td>'+u.nama+'</td><td>'+u.email+'</td><td>'+(u.nip||u.nis||u.kelas||u.siswa_ids||'-')+'</td><td><button class="btn" onclick="del(\''+u.id+'\')">Hapus</button> '+(role==='siswa'?'<button class="btn green" onclick="qr(\''+u.id+'\')">QR</button>':'')+'</td></tr>'});list.innerHTML=h||'<tr><td colspan=4>Belum ada data</td></tr>'})}function saveUser(){var b={nama:nama.value,email:email.value,password:password.value};if(role==='guru')b.nip=extra.value;if(role==='siswa'){b.nis=extra.value;b.kelas=extra.value||'X-A'}if(role==='wali')b.siswa_ids=extra.value.split(',').map(x=>x.trim()).filter(Boolean);fetch(api('/api/jurnal/users/'+role),{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).then(d=>{if(d.ok){nama.value=email.value=password.value=extra.value='';load()}else alert(d.error)})}function del(id){if(!confirm('Hapus?'))return;fetch(api('/api/jurnal/users/'+role+'/'+id),{method:'DELETE',headers:auth()}).then(()=>load())}function qr(id){fetch(api('/api/jurnal/users/siswa/'+id+'/qr'),{headers:auth()}).then(r=>r.json()).then(d=>{qr.innerHTML='';new QRCode(qr,{text:d.data.qr_token,width:180,height:180})})}load()</script><script src="../assets/jurnal-shell.js"></script>
<script src="../assets/jurnal-feature.js"></script><script src="../assets/jurnal-excel.js"></script>
</body></html>
