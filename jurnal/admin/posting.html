<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posting Informasi</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#f4f6fa;margin:0;color:#1a2a3a}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #0001}.btn{background:#05386b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.green{background:#1da462}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,select,textarea{padding:10px;border:1px solid #dde3ed;border-radius:10px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dde3ed;text-align:left;font-size:13px}th{background:#f4f6fa;color:#6b7a90}.muted{color:#6b7a90;font-size:13px}</style><link rel="stylesheet" href="../assets/jurnal-shell.css">
<link rel="stylesheet" href="../assets/jurnal-excel.css">
</head><body><div class="wrap"><div class="top"><h2>Posting Informasi</h2><button class="btn" onclick="history.back()">Kembali</button></div><div class="card"><p class="muted">Modul terhubung ke backend jurnal multi-tenant.</p><div class="grid"><input id="nama_kegiatan" placeholder="Judul Posting"><input id="keterangan" placeholder="Isi Posting"><button class="btn green" onclick="save()">Simpan</button></div></div><div class="card"><h3>Data</h3><table><thead><tr><th>ID</th><th>Ringkasan</th><th>Tanggal</th></tr></thead><tbody id="list"></tbody></table></div></div><script>var BASE=location.pathname.match(/^\/t\/([a-z0-9-]+)/)?'/t/'+location.pathname.match(/^\/t\/([a-z0-9-]+)/)[1]:'';var T=sessionStorage.getItem('jurnal_token');if(!T)location.href=BASE+'/jurnal/login.html';function auth(){return{Authorization:'Bearer '+T}}function api(u){return BASE+u}function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}function summary(x){return esc(x.nama||x.mapel||x.nama_kegiatan||x.nama_ekskul||x.waktu_sholat||x.materi||x.keterangan||x.status||x.id)}function load(){fetch(api('/api/jurnal/posting'),{headers:auth()}).then(r=>r.json()).then(d=>{let arr=d.data||[];list.innerHTML=arr.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+summary(x)+'</td><td>'+esc(x.tanggal||x.dibuat||'')+'</td></tr>').join('')||'<tr><td colspan=3>Belum ada data</td></tr>'})}function save(){fetch(api('/api/jurnal/posting'),{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({nama_kegiatan:document.getElementById("nama_kegiatan").value, keterangan:document.getElementById("keterangan").value})}).then(r=>r.json()).then(d=>{if(!d.ok)alert(d.error||'Gagal');load()})}load()</script><script src="../assets/jurnal-shell.js"></script>
<script src="../assets/jurnal-excel.js"></script>
</body></html>
