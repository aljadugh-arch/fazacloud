<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penilaian Jurnal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#f4f6fa;margin:0;color:#1a2a3a}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #0001}.btn{background:#05386b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.green{background:#1da462}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}input,select{padding:10px;border:1px solid #dde3ed;border-radius:10px;width:100%}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dde3ed;text-align:left;font-size:13px}th{background:#f4f6fa;color:#6b7a90}@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style><link rel="stylesheet" href="../assets/jurnal-shell.css">
<link rel="stylesheet" href="../assets/jurnal-excel.css">
<link rel="stylesheet" href="../assets/jurnal-feature.css">
</head><body><div class="wrap"><div class="top"><h2>Penilaian Siswa</h2><div><button class="btn" onclick="exportCSV()">Export CSV</button> <button class="btn" onclick="location.href='index.html'">Dashboard</button></div></div><div class="card"><h3>Input Nilai</h3><div class="grid"><input id="siswa" placeholder="ID Siswa"><input id="mapel" placeholder="Mapel"><input id="semester" placeholder="Semester"><input id="uh1" type="number" placeholder="UH1"><input id="uh2" type="number" placeholder="UH2"><input id="pts" type="number" placeholder="PTS"><input id="pas" type="number" placeholder="PAS"><button class="btn green" onclick="simpan()">Simpan</button></div></div><div class="card"><h3>Daftar Nilai</h3><table><thead><tr><th>Siswa</th><th>Mapel</th><th>Semester</th><th>UH1</th><th>UH2</th><th>PTS</th><th>PAS</th><th>Akhir</th></tr></thead><tbody id="list"></tbody></table></div></div><script>var BASE=location.pathname.match(/^\/t\/([a-z0-9-]+)/)?'/t/'+location.pathname.match(/^\/t\/([a-z0-9-]+)/)[1]:'';var T=sessionStorage.getItem('jurnal_token');if(!T){location.href=BASE+'/jurnal/login.html'}var rows=[];function auth(){return{Authorization:'Bearer '+T}}function api(u){return BASE+u}function hitung(){return Math.round(([uh1.value,uh2.value,pts.value,pas.value].map(Number).reduce((a,b)=>a+(b||0),0))/4)}function load(){fetch(api('/api/jurnal/penilaian'),{headers:auth()}).then(r=>r.json()).then(d=>{rows=d.data||[];list.innerHTML=rows.map(x=>'<tr><td>'+x.siswa_id+'</td><td>'+x.mapel+'</td><td>'+x.semester+'</td><td>'+x.uh1+'</td><td>'+x.uh2+'</td><td>'+x.pts+'</td><td>'+x.pas+'</td><td><b>'+x.nilai_akhir+'</b></td></tr>').join('')})}function simpan(){fetch(api('/api/jurnal/penilaian'),{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({siswa_id:siswa.value,mapel:mapel.value,semester:semester.value,uh1:Number(uh1.value),uh2:Number(uh2.value),pts:Number(pts.value),pas:Number(pas.value),nilai_akhir:hitung()})}).then(()=>load())}function exportCSV(){var csv='siswa,mapel,semester,uh1,uh2,pts,pas,nilai_akhir\n'+rows.map(r=>[r.siswa_id,r.mapel,r.semester,r.uh1,r.uh2,r.pts,r.pas,r.nilai_akhir].join(',')).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='penilaian.csv';a.click()}load()</script><script src="../assets/jurnal-shell.js"></script>
<script src="../assets/jurnal-advanced-config.js"></script><script src="../assets/jurnal-feature.js"></script><script src="../assets/jurnal-excel.js"></script>
</body></html>
